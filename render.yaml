services:
  - type: web
    name: maestria
    runtime: python
    plan: starter
    buildCommand: pip install -r backend/requirements-prod.txt && cd backend && python manage.py collectstatic --noinput
    startCommand: cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --worker-class gthread --workers 2 --threads 4 --timeout 150 --keep-alive 5 --access-logfile - --error-logfile -
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: maestria-amcn.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SITE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      # IA: usar 'mock' por defecto en producción hasta que se configure un proveedor real.
      # Para un proveedor real, configurar sus credenciales y un identificador de modelo
      # vigente y compatible con el endpoint usado por el adaptador.
      - key: AI_PROVIDER
        value: mock
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: ""
      - key: AI_TIMEOUT_SECONDS
        value: "60"
      - key: AI_MAX_CONCURRENT_ANSWERS
        value: "3"
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: CSRF_TRUSTED_ORIGINS
        value: ""
