services:
  - type: web
    name: maestria-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements-prod.txt
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 90
    healthCheckPath: /api/health/
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: maestria-api.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: AI_PROVIDER
        value: mock
      - key: AI_EXTERNAL_PROCESSING_APPROVED
        value: "False"
      - key: AI_GEMINI_PAID_TIER_CONFIRMED
        value: "False"
      - key: AI_GEMINI_FREE_TIER_SYNTHETIC_EVAL
        value: "False"
      - key: AI_TIMEOUT_SECONDS
        value: "45"
      - key: AI_MAX_CONCURRENT_ANSWERS
        value: "3"
