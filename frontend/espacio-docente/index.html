<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f4f1e8">
  <meta name="description" content="Espacio docente de MaestrIA.">
  <meta name="robots" content="noindex,nofollow">
  <script>
    (function () {
      try {
        var saved = sessionStorage.getItem('maestria-theme');
        var preferred = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = saved === 'dark' || saved === 'light' ? saved : preferred;
      } catch (_) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
  <title>Espacio docente — MaestrIA</title>
  <link rel="icon" href="../assets/images/maestria-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/app.css">
  <link rel="stylesheet" href="../assets/css/app-polish.css">
  <link rel="stylesheet" href="../assets/css/app-responsive.css">
  <link rel="stylesheet" href="../assets/css/dashboard-reference.css">
  <link rel="stylesheet" href="../assets/css/workspace-business-flow.css">
  <link rel="stylesheet" href="../assets/css/workspace-identity.css">
  <script type="module" src="../assets/js/workspace.js"></script>
</head>
<body class="app-body">
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <a class="app-brand" href="../index.html" aria-label="MaestrIA — volver al sitio">
          <img class="app-brand-logo" src="../assets/images/maestria-logo-oscuro.png" alt="MaestrIA · Docentes">
          <img class="app-brand-symbol" src="../assets/images/isotipo-oscuro.png" alt="">
        </a>
        <button class="sidebar-collapse" id="sidebar-collapse" type="button" aria-label="Contraer menú" aria-expanded="true" title="Contraer menú"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 9l-3 3 3 3"/></svg></button>
        <button class="sidebar-close" id="sidebar-close" type="button" aria-label="Cerrar menú">×</button>
      </div>
      <div class="workspace-switch"><span class="workspace-avatar" id="workspace-avatar">MD</span><span><strong>Mi espacio</strong><small id="workspace-role">Docencia · Personal</small></span><b>⌄</b></div>
      <nav class="side-nav" aria-label="Navegación del espacio docente">
        <button class="side-link active" data-view="dashboard" data-teacher-nav aria-label="Resumen" title="Resumen" type="button" aria-current="page"><span class="side-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.4"/></svg></span><span class="side-text">Resumen</span></button>
        <button class="side-link" data-view="courses" data-teacher-nav aria-label="Cursos" title="Cursos" type="button"><span class="side-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C9.5 4.8 6.4 4.6 3.5 5.8v13c3-1.2 6.1-1 8.5.7m0-13c2.5-1.7 5.6-1.9 8.5-.7v13c-2.9-1.2-6-1-8.5.7m0-13v13.7"/><path d="M6.5 9h2.7M6.5 12h2.7m6.1-3h2.7m-2.7 3H18"/></svg></span><span class="side-text">Cursos</span><span class="side-count" id="course-count">0</span></button>
        <button class="side-link" data-view="students" data-teacher-nav aria-label="Estudiantes" title="Estudiantes" type="button"><span class="side-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3.5 19v-1.4A4.6 4.6 0 0 1 8.1 13h1.8a4.6 4.6 0 0 1 4.6 4.6V19zM16 5.4a3 3 0 0 1 0 5.8m1.1 2.2a4.6 4.6 0 0 1 3.4 4.5V19h-3"/></svg></span><span class="side-text">Estudiantes</span></button>
        <button class="side-link" data-view="admin" aria-label="Administración" title="Administración" id="admin-nav" type="button" hidden><span class="side-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 20 6v5.4c0 4.6-3 7.6-8 9.8-5-2.2-8-5.2-8-9.8V6z"/><circle cx="12" cy="10" r="2.2"/><path d="M8.5 16a3.8 3.8 0 0 1 7 0"/></svg></span><span class="side-text">Administración</span></button>
        <button class="side-link" data-view="institution" aria-label="Mi institución" title="Mi institución" id="institution-nav" type="button" hidden><span class="side-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 20.5h17M5.5 20.5v-15h13v15M8.5 8h2m3 0h2m-7 4h2m3 0h2m-7 4h2m3 0h2M10 20.5v-3h4v3"/></svg></span><span class="side-text">Mi institución</span></button>
      </nav>
      <div class="sidebar-course-shortcuts" id="sidebar-course-shortcuts" aria-label="Accesos rápidos a cursos" hidden></div>
      <div class="sidebar-bottom">
        <div class="sidebar-tip"><span>✳</span><p><strong>Una nota al margen</strong><br>La IA sugiere. Vos decidís.</p></div>
        <button class="profile-trigger" id="profile-trigger" type="button"><span class="profile-avatar" id="profile-avatar">MD</span><span><strong id="profile-name">Docente</strong><small id="profile-email"></small></span><b>···</b></button>
      </div>
    </aside>

    <main class="app-main">
      <header class="app-topbar">
        <button class="mobile-menu-button" id="mobile-menu-button" type="button" aria-label="Abrir menú" aria-expanded="false"><span class="menu-lines" aria-hidden="true"></span></button>
        <div class="breadcrumbs"><a href="../index.html">MaestrIA</a><span>/</span><strong id="breadcrumb-current">Resumen</strong></div>
        <div class="topbar-actions"><span class="today-label" id="today-label"></span><button class="icon-button theme-toggle" id="theme-toggle" type="button" aria-label="Cambiar tema" title="Cambiar tema" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor"/></svg></button><button class="icon-button" id="help-button" type="button" aria-label="Abrir guía de uso" title="Guía de uso">?</button><button class="top-avatar" id="top-profile" type="button" aria-label="Perfil">MD</button></div>
      </header>
      <div class="app-content" id="app-content" tabindex="-1"><section class="panel"><div class="panel-body"><p>Conectando con MaestrIA…</p></div></section></div>
    </main>
  </div>
  <div class="sidebar-scrim" id="sidebar-scrim"></div>
  <div class="modal-layer" id="modal-layer" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal-header"><div><h2 id="modal-title">Nuevo elemento</h2></div><button class="modal-close" id="modal-close" type="button" aria-label="Cerrar">×</button></header>
      <div id="modal-content"></div>
    </section>
  </div>
  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
  <div class="profile-menu" id="profile-menu" hidden><button data-profile-action="profile" type="button">Mi perfil y preferencias</button><button data-profile-action="guide" type="button">Ver guía inicial</button><button data-profile-action="logout" type="button" class="danger-text">Cerrar sesión</button></div>
  <div id="quickstart-root"></div>
</body>
</html>
