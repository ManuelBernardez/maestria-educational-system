name: frontend-checks
on:
  push:
    paths: ["frontend/**", "scripts/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", "scripts/**", ".github/workflows/frontend.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python scripts/check_static_frontend.py
